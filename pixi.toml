[workspace]
name = "lightning2earthcare"
# Use conda-forge for scientific libraries; EUMDAC comes from EUMETSAT.
channels = ["conda-forge", "eumetsat"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
requires-pixi = ">=0.67.2"
exclude-newer = "10d"

[tasks]
cli = "python -m lightning2ec.cli"
check = "python -m lightning2ec.cli --help"

[dependencies]
click = "==8.3.0"
eumdac = { version = "==3.0.0", channel = "eumetsat" }
fsspec = "==2025.9.0"
geopandas = "==1.1.3"
numpy = "==2.3.3"
pandas = "==2.3.2"
pyarrow = "==23.0.1"
pyorbital = "==1.10.2"
pyproj = "==3.7.2"
pystac-client = "==0.9.0"
python = "==3.13.7"
requests = "==2.32.5"
s3fs = "==2025.9.0"
scikit-learn = "==1.7.2"
scipy = "==1.16.2"
shapely = "==2.1.1"
xarray = "==2025.9.0"
dask-core = "==2025.9.1"
h5netcdf = "==1.6.4"
netcdf4 = "==1.7.2"
pykdtree = "==1.4.3"

[pypi-dependencies]
satpy = "==0.58.0"
